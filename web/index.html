<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D4 Slot Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>D4 Slot Editor</h1>
  <label>Class <select id="cls"></select></label>
  <label>Name <input id="fname" size="22"></label>
  <label>Load <select id="files"><option value="">(existing filter)</option></select></label>
  <button id="new">New</button>
  <button id="compile" class="primary">Compile &amp; copy</button>
  <span id="status"></span>
</header>
<main>
  <section id="doll" aria-label="Paper doll"></section>
  <section id="panel"><p class="muted">Pick a slot.</p></section>
  <aside id="side">
    <h2>Order</h2><ol id="order"></ol>
    <h2>Kept as-is <small>(rules the slot model cannot express)</small></h2><ul id="raw"></ul>
    <h2>Import notes</h2><ul id="notes"></ul>
  </aside>
</main>
<script src="app.js"></script>
</body>
</html>
